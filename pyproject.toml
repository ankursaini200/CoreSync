[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coresync"
version = "0.1.0"
description = "Multicore Processing and Parallelism Simulator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CoreSync Team" }
]
dependencies = [
    "PySide6>=6.8.0",
    "psutil>=6.1.0",
    "numpy>=2.1.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

